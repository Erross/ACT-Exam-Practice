name: Check
on:
  push:
  pull_request:
concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
      - name: Upload checked production site
        uses: actions/upload-artifact@v4
        with:
          name: act-production-site-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 7
